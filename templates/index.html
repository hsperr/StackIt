<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StackIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='stackit.css') }}">
</head>
<body>

<header class="topbar">
    <span class="logo-mark"></span>
    <h1 class="logo"><span class="stack">Stack</span><span class="it">It</span></h1>
    <p class="tagline">Stack blocks, trigger chain reactions, and topple the board into your colour. First to own every cell wins.</p>
</header>

<main class="wrap">
    <aside class="card panel" id="controls">
        <h2>Game setup</h2>

        <div class="field">
            <label for="size">Board size</label>
            <div class="row">
                <input class="grow" type="text" id="size" value="{{ game.board.size_x }}" inputmode="numeric">
                <button class="btn primary" id="btn-new" type="button">New</button>
            </div>
            <p class="hint">Square grid, N&times;N. Starts a fresh game.</p>
        </div>

        <hr class="divider">

        <div class="field">
            <label for="ais">AI opponent</label>
            <select id="ais">
                <option value="alpha" {{ game.is_alpha() }}>AlphaBeta</option>
                <option value="mcts" {{ game.is_mcts() }}>Monte Carlo Tree Search</option>
            </select>
        </div>

        <div class="field">
            <label for="thinking_time">AI thinking time (seconds)</label>
            <input type="text" id="thinking_time" value="{{ game.thinking_time }}" inputmode="numeric">
        </div>

        <div class="field">
            <label for="max_depth">AI max search depth</label>
            <div class="row">
                <input class="grow" type="text" id="max_depth" value="{{ game.max_depth }}" inputmode="numeric">
                <button class="btn" id="btn-set" type="button">Apply</button>
            </div>
        </div>

        <hr class="divider">

        <button class="btn ghost" id="btn-undo" type="button">&#8630; Undo last move</button>
    </aside>

    <section id="board">
        {% include 'board.html' %}
    </section>
</main>

<script>
    window.STACKIT = { iid: "{{ game.iid }}" };
</script>
<script src="{{ url_for('static', filename='stackit.js') }}"></script>

</body>
</html>
