<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StackIt</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
<style>
.tile
{
	width: 32px;
	height: 32px;
	float: left;
	text-align: center;
	vertical-align: middle;
}
.hover
{
	-webkit-box-shadow: inset 0px 0px 5px 5px rgba(50, 150, 25, .5);
	box-shadow: inset 0px 0px 5px 5px rgba(50, 150, 25, .5);
}

</style>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
</head>
<body>

<div class="jumbotron text-center" style="margin-bottom:0">
  <h1>StackIt</h1>
</div>

<div class="container">
  <div class="row">
    <div class="col-sm-4">
        <h3>Menu</h3>
        <div id="Menu">
            <form>
                <div class="input-group">
                    <input type="sizex" class="form-control" id="sizex" aria-describedby="" value="5">
                    <input type="sizey" class="form-control" id="sizey" aria-describedby="" value="5">
                 </div>
                <button id="btn-new" type="button" class="btn btn-dark">New</button>
            </form>
            <br />
            <button id="btn-undo" type="button" class="btn btn-dark">Undo</button>
        </div>
    </div>
    <div class="col-sm-8">
        <div id="board">
        {% include 'board.html' %}
        </div>
    </div>
  </div>
</div>

</body>
<script>
   $("#btn-new")
    .on("click", function(){
        sizex = $("#sizex").val();
        sizey = $("#sizey").val();
        $.ajax({
          url: "{{gameid}}/new",
          type: "post",
          data: {"x": sizex, "y": sizey},
          success: function(response) {
            $("#board").html(response);
          },
          error: function(xhr) {
            //Do Something to handle error
          }
        });
    })
    $("#btn-undo")
    .on("click", function(){
        $.ajax({
          url: "{{gameid}}/undo",
          type: "post",
          data: {},
          success: function(response) {
            $("#board").html(response);
          },
          error: function(xhr) {
            //Do Something to handle error
          }
        });
    })
</script>

</html>
